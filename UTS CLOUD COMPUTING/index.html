<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS Komputasi Awan - Marcel Hidayatullah Achlam</title>
    <style>
        /* Efek geser mulus saat tombol diklik */
        html {
            scroll-behavior: smooth;
        }

        /* Animasi bergerak */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(0, 123, 255, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(0, 123, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 123, 255, 0); }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #f4f4f9;
        }

        /* BAGIAN 1: HALAMAN PALING DEPAN (HERO SECTION) */
        .hero-section {
            height: 100vh; /* Tinggi penuh 1 layar penuh */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .hero-title {
            font-size: 3rem;
            margin: 0 0 15px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: fadeInDown 1s ease-out;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 35px;
            max-width: 600px;
            animation: fadeInUp 1s ease-out;
        }

        /* Tombol menuju Profil Pribadi */
        .btn-start {
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f2027;
            background-color: #38bdf8;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        .btn-start:hover {
            background-color: #0284c7;
            color: white;
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }

        /* BAGIAN 2: HALAMAN PROFIL & TUGAS */
        .profile-section {
            min-height: 100vh;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #0284c7;
            animation: pulseGlow 2s infinite;
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05);
        }

        h2.name { 
            margin: 10px 0 5px; 
            color: #0284c7; 
        }

        .nim, .address { 
            color: #666; 
            margin: 5px 0; 
        }

        .section-title {
            margin-top: 30px;
            border-bottom: 2px solid #0284c7;
            padding-bottom: 5px;
            text-align: left;
            color: #333;
        }

        ul.task-list {
            list-style: none;
            padding: 0;
            text-align: left;
        }

        ul.task-list li {
            margin: 12px 0;
        }

        ul.task-list a {
            display: block;
            padding: 12px 18px;
            background: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        ul.task-list a:hover {
            background: #0369a1;
            transform: translateX(8px);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .btn-back {
            display: inline-block;
            margin-top: 25px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-back:hover {
            color: #0284c7;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- HALAMAN 1: COVER UTS KOMPUTASI AWAN -->
    <section id="beranda" class="hero-section">
        <h1 class="hero-title">UTS KOMPUTASI AWAN</h1>
        <p class="hero-subtitle">Landing Page Portofolio & Kumpulan Tugas Perkuliahan</p>
        
        <!-- Tombol untuk turun menuju profil pribadi -->
        <a href="#profil" class="btn-start">Lihat Profil Pribadi ↓</a>
    </section>

    <!-- HALAMAN 2: PROFIL PRIBADI & DAFTAR TUGAS -->
    <section id="profil" class="profile-section">
        <div class="container">
            <img src="foto.jpg" alt="Foto Profil" class="profile-img">
            
            <h2 class="name">Marcel Hidayatullah Achlam</h2>
            <p class="nim">NIM: 240010006</p>
            <p class="address">Alamat: Denpasar, Bali</p>

            <div class="section-title">
                <h3>Daftar Tugas Sebelumnya</h3>
            </div>
            
            <ul class="task-list">
    <li><a href="Tugas Cloud Computing Dalam SaaS.pdf" target="_blank">🔗 Tugas: Cloud Computing Dalam SaaS</a></li>
</ul>

            <a href="#beranda" class="btn-back">↑ Kembali ke Atas</a>
        </div>
    </section>

</body>
</html>
